<div class="auth-layout">
  <section class="card auth-card">
    <p class="tag" aria-hidden="true">Re-yo!</p>
    <p class="eyebrow">ON AIR</p>
    <h1>Connexion</h1>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>Email<input type="email" formControlName="email" /></label>
      <label>Mot de passe<input type="password" formControlName="password" /></label>
      <button type="submit">Se connecter</button>
    </form>
    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
    <p><a routerLink="/register">Créer un compte</a></p>
  </section>

  <div class="auth-scene scene-frame">
    <!-- on viewport: the 3D scene chunk is loaded when this block is visible (prefetched when the browser is idle). -->
    @defer (on viewport; prefetch on idle) {
      <app-studio-scene screenText="Prêt à jouer ?" />
    } @placeholder {
      <div class="scene-placeholder"></div>
    }
  </div>
</div>
